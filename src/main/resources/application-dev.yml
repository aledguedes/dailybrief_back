spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dailydb
    username: postgres
    password: bemagro
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          '[time_zone]': UTC

  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    '[org.springframework]': DEBUG
    '[com.dailybrief]': DEBUG
