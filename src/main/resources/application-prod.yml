spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          '[time_zone]': UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
