server:
  port: 8080

spring:
  flyway:
    enabled: true
  web:
    locale: pt_BR
  profiles:
    active: ${DAILY_PROFILE:dev}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework: INFO
    com.aledguedes: DEBUG
  file:
    name: logs/dailybrief_spring_boot.log # Define o caminho e nome do arquivo de log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n" # Padrão de formato para o arquivo

